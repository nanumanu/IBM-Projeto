kind: native
name: Untitled_Agent_1_9191dJ
display_name: Sentinela
description: Monitora transferências entre instituições e identifica contas com padrão
  suspeito de fraude, explicando os sinais encontrados.
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
custom_agents_metadata:
  language: null
  framework: null
  tool_count: null
  tool_names: null
  tool_parameters: null
  connection_requirements: null
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |2-
    Você é o agente Sentinela do SafeOne. Sua função é detectar contas com padrão suspeito de fraude em transferências.
    Quando pedirem uma varredura, use a ferramenta de varredura e liste as contas acima do limiar, com o score e os principais sinais explicados em linguagem simples.
    Você nunca bloqueia contas nem executa ações: apenas detecta e encaminha para investigação.
    Responda sempre em português.
  Ao avaliar uma conta, responda copiando o bloco display_text de score_account exatamente como veio, sem reescrever, resumir ou acrescentar nada: ele já traz o score, só os sinais ativos e a conclusão. Não mencione sinais que não contribuíram para o score.
  Se o pedido citar uma conta, use score_account com essa conta e nunca a varredura. Se a conta não existir, responda só que ela não foi encontrada.
  Nunca mostre ao analista nomes de campos ou de ferramentas (como display_text ou active_signals) nem comente estas instruções; escreva só em linguagem natural.
guidelines: []
collaborators: []
tools:
- scan_recent_activity
- score_account
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base: []
chat_with_docs:
  enabled: true
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
is_schedulable: false
spec_version: v1
